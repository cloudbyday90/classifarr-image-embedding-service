name: Trivy Security Scan

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

on:
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  schedule:
    # Weekly scan on Tuesday at 02:00 UTC (staggered from CodeQL on Monday)
    - cron: '0 2 * * 2'

jobs:
  trivy-fs:
    name: Filesystem Vulnerability & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required to upload SARIF to GitHub Security tab
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native Trivy binary
        run: |
          python scripts/install_ci_tool.py trivy --directory "$RUNNER_TEMP/verified-tools"
          echo "$RUNNER_TEMP/verified-tools" >> "$GITHUB_PATH"

      # SARIF pass: upload all HIGH/CRITICAL findings to the Security tab
      - name: Run Trivy (SARIF upload)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CMD: ${{ runner.temp }}/verified-tools/trivy
        with:
          cache: false
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif
          limit-severities-for-sarif: true
          skip-dirs: .git,__pycache__,.venv,venv,.pytest_cache

      - name: Upload Trivy FS results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      # Table pass: gate the PR/push on exit code (fail on HIGH/CRITICAL)
      - name: Run Trivy (PR gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CMD: ${{ runner.temp }}/verified-tools/trivy
        with:
          cache: false
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-dirs: .git,__pycache__,.venv,venv,.pytest_cache

  trivy-config:
    name: Dockerfile & Docker Compose Misconfig Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native Trivy binary
        run: |
          python scripts/install_ci_tool.py trivy --directory "$RUNNER_TEMP/verified-tools"
          echo "$RUNNER_TEMP/verified-tools" >> "$GITHUB_PATH"

      # Scans Dockerfile and docker-compose*.yml against CIS Docker Benchmark
      - name: Run Trivy (IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CMD: ${{ runner.temp }}/verified-tools/trivy
        with:
          cache: false
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config-results.sarif

      - name: Upload Trivy config results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config
