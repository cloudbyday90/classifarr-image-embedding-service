name: CI/CD Pipeline

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-torch-cpu.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt -c requirements-torch-cpu.txt
          pip check

      - name: Audit Python runtime dependencies
        run: |
          pip install "pip-audit>=2.10.1"
          # OSV can audit vendor Torch local versions that are absent from PyPI.
          pip-audit --local --strict --vulnerability-service osv

      - name: Run tests
        run: pytest

      - name: Coverage ratchet check
        run: python scripts/check_coverage_ratchet.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  backend-smoke:
    name: Backend smoke (${{ matrix.backend }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile
          - backend: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
          - backend: cuda
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.cuda
          - backend: openvino
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.openvino
          - backend: cuda-legacy
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.cuda
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for CUDA wheel layers on the disposable runner
        if: startsWith(matrix.backend, 'cuda')
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # This Docker-only job does not use these preinstalled SDKs or tool caches.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache
          df -h /var/lib/docker
      - name: Build local image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          LEGACY_PROFILE: ${{ matrix.backend == 'cuda-legacy' }}
        run: |
          build_args=()
          if [ "$LEGACY_PROFILE" = "true" ]; then
            build_args=(
              --build-arg CUDA_BASE=nvidia/cuda:12.6.3-base-ubuntu24.04@sha256:c87e78933f4c16e3272123bf2f75537306596d0fbaa395a29696a22786e5ee0e
              --build-arg TORCH_PROFILE=requirements-torch-cuda-legacy.txt
              --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu126
            )
          fi
          docker build --platform "linux/$ARCH" "${build_args[@]}" -f "$DOCKERFILE" -t backend-smoke:local .
      - name: Audit the actual runtime packages without changing the image
        run: >-
          docker run --rm --user root --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m
          --cap-drop ALL --security-opt no-new-privileges --entrypoint sh backend-smoke:local -c
          'python -m pip install -q --root-user-action=ignore --target /tmp/audit-tools "pip-audit>=2.10.1" &&
          PYTHONPATH=/tmp/audit-tools python -m pip_audit --strict --vulnerability-service osv
          --path /opt/venv/lib/python3.12/site-packages --cache-dir /tmp/audit-cache'
      - name: Check dependencies and offline startup as non-root
        env:
          BACKEND: ${{ matrix.backend }}
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges
          --entrypoint python backend-smoke:local scripts/smoke_backend.py --backend "$BACKEND"

  docker-release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, backend-smoke]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/cloudbyday90/classifarr-image-embedder
            cloudbyday90/classifarr-image-embedder
          tags:
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-old-releases:
    name: Cleanup Old Container Images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-release

    permissions:
      packages: write

    steps:
      - name: Delete old GHCR packages (keep last 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'classifarr-image-embedder'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Get Docker Hub token
        id: docker-token
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get and delete old Docker Hub tags (keep last 5)
        run: |
          TAGS=$(curl -s -H "Authorization: Bearer ${{ steps.docker-token.outputs.token }}" \
            "https://hub.docker.com/v2/repositories/cloudbyday90/classifarr-image-embedder/tags?page_size=100" \
            | jq -r '.results | sort_by(.last_updated) | .[].name')

          TAG_COUNT=$(echo "$TAGS" | grep -v "^latest$" | wc -l)
          KEEP_COUNT=5

          if [ "$TAG_COUNT" -gt "$KEEP_COUNT" ]; then
            DELETE_COUNT=$((TAG_COUNT - KEEP_COUNT))
            echo "Deleting $DELETE_COUNT old tags from Docker Hub..."

            TAGS_TO_DELETE=$(echo "$TAGS" | grep -v "^latest$" | head -n $DELETE_COUNT)

            for TAG in $TAGS_TO_DELETE; do
              echo "Deleting tag: $TAG"
              curl -s -X DELETE \
                -H "Authorization: Bearer ${{ steps.docker-token.outputs.token }}" \
                "https://hub.docker.com/v2/repositories/cloudbyday90/classifarr-image-embedder/tags/$TAG/"
            done
          else
            echo "Only $TAG_COUNT tags exist, keeping all (minimum is $KEEP_COUNT)"
          fi
