name: CI/CD Pipeline

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            requirements/locks/*.txt
            requirements/locks/*.json

      - name: Install dependencies
        run: |
          python scripts/lock_dependencies.py --check
          python -m venv .venv
          .venv/bin/python scripts/install_dependencies.py --backend bootstrap
          .venv/bin/python scripts/install_dependencies.py --backend qa
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Audit Python runtime dependencies
        run: |
          python scripts/install_dependencies.py --backend audit --target "$RUNNER_TEMP/audit-tools"
          # OSV can audit vendor Torch local versions that are absent from PyPI.
          PYTHONPATH="$RUNNER_TEMP/audit-tools" python -m pip_audit --strict --vulnerability-service osv \
            --path "$PWD/.venv/lib/python3.12/site-packages" --cache-dir "$RUNNER_TEMP/audit-cache"
          PYTHONPATH="$RUNNER_TEMP/audit-tools" python -m pip_audit --strict --vulnerability-service osv \
            --path "$RUNNER_TEMP/audit-tools" --cache-dir "$RUNNER_TEMP/audit-cache"

      - name: Run tests
        run: pytest

      - name: Coverage ratchet check
        run: python scripts/check_coverage_ratchet.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  backend-smoke:
    name: Backend smoke (${{ matrix.backend }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile
          - backend: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
          - backend: cuda
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.cuda
          - backend: openvino
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.openvino
          - backend: cuda-legacy
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.cuda
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for CUDA wheel layers on the disposable runner
        if: startsWith(matrix.backend, 'cuda')
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # This Docker-only job does not use these preinstalled SDKs or tool caches.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache
          df -h /var/lib/docker
      - name: Build local image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          LEGACY_PROFILE: ${{ matrix.backend == 'cuda-legacy' }}
        run: |
          build_args=()
          refresh_args=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            refresh_args=(--pull --no-cache)
          fi
          if [ "$LEGACY_PROFILE" = "true" ]; then
            build_args=(
              --build-arg CUDA_BASE=nvidia/cuda:12.6.3-base-ubuntu24.04@sha256:c87e78933f4c16e3272123bf2f75537306596d0fbaa395a29696a22786e5ee0e
              --build-arg TORCH_PROFILE=requirements-torch-cuda-legacy.txt
              --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu126
            )
          fi
          docker build --platform "linux/$ARCH" "${refresh_args[@]}" "${build_args[@]}" -f "$DOCKERFILE" -t backend-smoke:local .
      - name: Audit the actual runtime packages without changing the image
        run: >-
          docker run --rm --user root --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m
          --cap-drop ALL --security-opt no-new-privileges --entrypoint sh backend-smoke:local -c
          'python scripts/install_dependencies.py --backend audit --target /tmp/audit-tools &&
          PYTHONPATH=/tmp/audit-tools python -m pip_audit --strict --vulnerability-service osv
          --path /opt/venv/lib/python3.12/site-packages --cache-dir /tmp/audit-cache &&
          PYTHONPATH=/tmp/audit-tools python -m pip_audit --strict --vulnerability-service osv
          --path /tmp/audit-tools --cache-dir /tmp/audit-cache'
      - name: Check dependencies and offline startup as non-root
        env:
          BACKEND: ${{ matrix.backend }}
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges
          --entrypoint python backend-smoke:local scripts/smoke_backend.py --backend "$BACKEND"

  docker-release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, backend-smoke]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release Buildx binary
        run: |
          python scripts/install_ci_tool.py buildx --directory "$HOME/.docker/cli-plugins"
          docker buildx version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          # A nonempty value replaces the action's implicit insecure entitlements.
          buildkitd-flags: --debug=false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/cloudbyday90/classifarr-image-embedder
            cloudbyday90/classifarr-image-embedder
          tags:
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-old-releases:
    name: Cleanup Old Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: docker-release

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout cleanup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete old GHCR packages (keep last 5)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: 'classifarr-image-embedder'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Delete old Docker Hub tags after complete inventory validation
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python scripts/cleanup_dockerhub.py
