name: OSV Dependency Scan

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

on:
  pull_request:
    branches: [ main, master ]
  push:
    tags:
      - "v*"

jobs:
  pr-scan-dependabot:
    name: OSV Scan (PR, Dependabot)
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OSV scan (no SARIF upload for Dependabot)
        # PR 40's v2.3.8 image, pinned because the upstream wrapper uses a mutable image tag.
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:48406c58197201fe55e56615ad9d414f85063da320e204d0b0ed460fb3908dba
        with:
          args: >-
            --recursive
            ./

  pr-scan:
    name: OSV Scan (PR)
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  release-scan:
    name: OSV Scan (Tag Release)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5
    with:
      fail-on-vuln: true
