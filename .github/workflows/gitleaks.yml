name: Gitleaks Secret Scan

permissions: {}

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']
  schedule:
    - cron: '0 2 * * 3'
  workflow_dispatch:

jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native Gitleaks binary
        run: python scripts/install_ci_tool.py gitleaks --directory "$RUNNER_TEMP/verified-tools"
      - name: Scan fetched history with full redaction
        run: >-
          "$RUNNER_TEMP/verified-tools/gitleaks" git . --log-opts=--all --config=.gitleaks.toml
          --redact=100 --exit-code=2 --report-format=sarif --report-path=gitleaks-results.sarif
      - name: Retain redacted findings for investigation
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 5
      - name: Record remediation guidance
        if: always()
        run: >-
          echo 'Gitleaks scans fetched history. Inspect the redacted artifact on failure.
          Rotate exposed credentials immediately; removing a commit does not revoke them.' >> "$GITHUB_STEP_SUMMARY"
