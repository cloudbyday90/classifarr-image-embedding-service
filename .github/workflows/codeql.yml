name: CodeQL Analysis

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

on:
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
  push:
    branches: [ main, master ]
  schedule:
    # Weekly scan on Monday at 02:00 UTC (low-traffic window)
    - cron: '0 2 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CodeQL bundle before action extraction
        run: python scripts/install_ci_tool.py codeql --directory "$RUNNER_TEMP/verified-tools"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          tools: ${{ runner.temp }}/verified-tools/codeql-bundle-linux64.tar.gz
          languages: ${{ matrix.language }}
          # security-extended covers OWASP Top 10 and additional CWEs beyond the default suite
          queries: security-extended
          config: |
            paths-ignore:
              - '**/__pycache__/**'
              - '**/*.pyc'
              - 'tests/**'
              - '.venv/**'
              - 'venv/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
